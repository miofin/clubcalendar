<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ meeting.get('subject') or 'Meeting email' }} · Club Meetings</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="email-page">
<main class="email-reader">
  <nav class="email-toolbar" aria-label="Email navigation">
  <a class="back-link" href="{{ url_for('index') }}">← Back to calendar</a>
  </nav>
  <header class="email-header">
    <h1 class="email-subject">{{ meeting.get('subject') or 'No subject' }}</h1>
  </header>
  {% if email_document %}
  <iframe class="email-frame" title="Original meeting email" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" srcdoc="{{ email_document }}"></iframe>
  {% else %}
  <p class="empty">Email content isn’t available.</p>
  {% endif %}
</main>
</body>
</html>
