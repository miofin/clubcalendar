<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Club Meetings</title>
<style>
body { margin:0; min-height:100vh; display:grid; place-items:center; background:#eef1f4; color:#17212b; font:1rem/1.5 system-ui,sans-serif; }
main { margin:1.25rem; padding:2rem; max-width:25rem; background:white; border:1px solid #d5dbe1; border-radius:12px; }
h1 { line-height:1.1; } p { color:#5d6b79; }
a { display:inline-block; padding:.7rem 1rem; background:#0b6e5f; color:white; border-radius:8px; text-decoration:none; font-weight:600; }
</style>
<main>
<h1>Club meetings</h1>
<p>Sign in with your Google account to view the meeting schedule.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<a href="/auth/google">Continue with Google</a>
</main>
</html>
